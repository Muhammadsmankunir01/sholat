<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Sholat Siswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="text-center mb-4">Aplikasi Absensi Sholat Siswa</h2>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Scan Barcode / QR Code</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="sholatSelect" class="form-label">Pilih Sholat:</label>
                        <select id="sholatSelect" class="form-select">
                            <option value="Dhuha">Dhuha</option>
                            <option value="Dzuhur">Dzuhur</option>
                            <option value="Ashar">Ashar</option>
                        </select>
                    </div>

                    <div id="reader" style="width: 100%;"></div>

                    <div class="mt-3">
                        <label class="form-label">Hasil Scan NIS:</label>
                        <input type="text" id="nisResult" class="form-control" placeholder="NIS akan muncul di sini" readonly>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h5 class="card-title mb-0">Log Absensi Hari Ini</h5>
                    <button onclick="clearData()" class="btn btn-sm btn-danger">Hapus Log</button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>Waktu</th>
                                    <th>NIS</th>
                                    <th>Sholat</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let attendanceLog = JSON.parse(localStorage.getItem('absensiSholat')) || [];

    // Tampilkan data awal jika ada
    updateTable();

    // Callback ketika barcode berhasil di-scan
    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('nisResult').value = decodedText;
        
        const sholat = document.getElementById('sholatSelect').value;
        const now = new Date();
        const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        const newRecord = {
            nis: decodedText,
            sholat: sholat,
            waktu: timeString
        };

        attendanceLog.unshift(newRecord);
        localStorage.setItem('absensiSholat', JSON.stringify(attendanceLog));
        
        updateTable();
        
        // Hentikan scan sejenak untuk menghindari double read
        html5QrcodeScanner.clear();
        setTimeout(startScanner, 2000);
    }

    function updateTable() {
        const tbody = document.getElementById('logTableBody');
        tbody.innerHTML = '';
        
        attendanceLog.forEach(item => {
            const row = `<tr>
                <td>${item.waktu}</td>
                <td>${item.nis}</td>
                <td><span class="badge bg-info">${item.sholat}</span></td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function clearData() {
        if (confirm("Apakah Anda yakin ingin menghapus seluruh log absensi?")) {
            attendanceLog = [];
            localStorage.removeItem('absensiSholat');
            updateTable();
        }
    }

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }
        );
        html5QrcodeScanner.render(onScanSuccess);
    }

    // Jalankan scanner saat halaman dimuat
    let html5QrcodeScanner;
    startScanner();
</script>

</body>
</html>
